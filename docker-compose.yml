services:
  nginx:
    build:
      context: ./docker/nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./my-app:/var/www/html # Laravel application directory
    depends_on:
      - php

  php:
    build:
      context: ./docker/php
    expose:
      - "9000"
    ports:
      - "8081:9000"
    volumes:
      - ./my-app:/var/www/html # Laravel application directory
    depends_on:
      - mysql

  mysql:
    build:
      context: ./docker/mysql
    platform: linux/x86_64
    ports:
      - "3307:3306" # host:container
    environment:
      - "LANG=C.UTF-8"
      - "MYSQL_ROOT_PASSWORD=root"
      - "MYSQL_DATABASE=clinic"
      - "MYSQL_PASSWORD=root"
    volumes:
      - type: volume
        source: mysql-volume
        target: /var/lib/mysql

networks:
  default:
    driver: bridge

volumes:
  mysql-volume:
    driver: local
